<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的导航页</title>
<style>
i.ic{display:inline-flex;align-items:center;justify-content:center;font-style:normal;line-height:1;flex-shrink:0;vertical-align:middle}i.ic svg{display:block;width:1em;height:1em}
:root{--bg:#0f0e2a;--bg2:#1a1740;--card-bg:rgba(255,255,255,0.15);--border:rgba(255,255,255,0.15);--text:#f0f0ff;--text2:rgba(240,240,255,0.65);--text3:rgba(240,240,255,0.38);--ac1:#8b5cf6;--ac2:#06b6d4;--ac3:#ec4899;--ac4:#f59e0b;--grad:linear-gradient(135deg,#8b5cf6,#ec4899,#06b6d4);--glow:rgba(139,92,246,0.3);--tag-bg:rgba(139,92,246,0.15);--tag:#c4b5fd;--blur:16px;--card-text:var(--text);--card-text2:var(--text2);--card-text3:var(--text3);--font:'AlibabaPuHuiTi','PingFang SC','Microsoft YaHei',sans-serif}
@font-face{font-family:AlibabaPuHuiTi;src:url('https://resource-static.bj.bcebos.com/fonts-skill/AlibabaPuHuiTi_Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:AlibabaPuHuiTi;src:url('https://resource-static.bj.bcebos.com/fonts-skill/AlibabaPuHuiTi_SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{min-height:100vh;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;transition:background 0.3s}
*{scrollbar-width:thin;scrollbar-color:var(--ac1) transparent}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--ac1);border-radius:3px}
a{color:inherit;text-decoration:none}
/* 壁纸模式（由 navigation-data.js 的 settings.useWallpaper 运行时开启） */
body.wp-mode{background-image:var(--wp-d);background-size:cover;background-position:center;background-attachment:fixed}
@media(max-width:768px){body.wp-mode{background-image:var(--wp-m);background-attachment:scroll}}

/* 装饰光晕 */
body::before{content:'';position:fixed;top:-20%;left:-10%;width:50vw;height:50vw;border-radius:50%;background:radial-gradient(circle,var(--glow) 0%,transparent 70%);pointer-events:none;z-index:0;animation:glowAnim 8s ease-in-out infinite alternate}
body::after{content:'';position:fixed;bottom:-15%;right:-10%;width:40vw;height:40vw;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,0.15) 0%,transparent 70%);pointer-events:none;z-index:0;animation:glowAnim 10s ease-in-out infinite alternate-reverse}
@keyframes glowAnim{from{transform:translate(0,0) scale(1)}to{transform:translate(3%,5%) scale(1.1)}}

/* 布局 */
#wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:16px}

/* 顶栏 */
.nav-top{display:flex;align-items:center;gap:10px;padding:10px 16px;margin-bottom:20px;background:rgba(255,255,255,0.07);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:14px}
.nav-logo{font-size:17px;font-weight:600;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}
.search-box{flex:1;max-width:340px;margin:0 auto;position:relative}
.search-box i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:12px}
.search-box input{width:100%;padding:7px 10px 7px 30px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.06);color:var(--text);font-family:var(--font);font-size:13px}
.search-box input:focus{outline:none;border-color:var(--ac1);box-shadow:0 0 0 2px var(--glow)}
.search-box input::placeholder{color:var(--text3)}
.theme-btns{display:flex;gap:5px;flex-shrink:0}
.theme-btn{padding:5px 9px;border-radius:7px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--text2);font-size:11px;cursor:pointer;transition:all 0.15s}
.theme-btn:hover,.theme-btn.active{border-color:var(--ac1);color:var(--ac1);background:var(--tag-bg)}

/* 分组 */
.groups-wrap{display:flex;flex-direction:column;gap:20px}
.group-section{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.group-header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border)}
.group-hicon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.group-hname{font-size:14px;font-weight:600;flex:1;color:var(--card-text);text-shadow:var(--card-shadow)}
.group-hcount{font-size:11px;color:var(--card-text3);text-shadow:var(--card-shadow)}
.links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:12px}

/* 链接卡片 */
.link-card{display:flex;flex-direction:column;background:var(--card-bg);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:all 0.2s;text-decoration:none;color:var(--card-text);position:relative;overflow:hidden}
.link-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:var(--grad);opacity:0;transition:opacity 0.2s}
.link-card:hover::before{opacity:1}
.link-card:hover{border-color:var(--ac1);box-shadow:0 0 0 1px var(--ac1),0 8px 30px rgba(0,0,0,0.3);transform:translateY(-2px)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-name{font-size:13px;font-weight:600;color:var(--card-text);text-shadow:var(--card-shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-url{font-size:11px;color:var(--card-text3);text-shadow:var(--card-shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-note{font-size:11px;color:var(--card-text2);text-shadow:var(--card-shadow);line-height:1.5;margin-bottom:8px;word-break:break-word}
/* 无匹配 */
.no-result{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px}
.no-result i{font-size:32px;margin-bottom:10px;display:block;opacity:0.3}

/* 空状态 */
.empty-page{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-page i{font-size:48px;display:block;margin-bottom:16px;opacity:0.4}
.empty-page p{font-size:15px}
.empty-group{min-height:90px;align-items:center;justify-content:center}
.empty-group-tip{color:var(--card-text3);font-size:12px;text-align:center;padding:20px}

/* 响应式 */
@media(max-width:768px){
  #wrap{padding:10px}
  .nav-top{flex-wrap:wrap;padding:8px 12px;margin-bottom:14px}
  .search-box{width:100%;max-width:none;order:3}
  .theme-btns{flex-wrap:wrap}
  .links-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;padding:10px}
}
@media(max-width:480px){
  .links-grid{grid-template-columns:1fr 1fr;gap:7px;padding:8px}
  .theme-btn span{display:none}
}
</style>
</head>
<body>
<div id="wrap">
  <div class="nav-top">
    <div class="nav-logo"><i class="ic" style="margin-right:6px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="m12 7-5.5 14"/><path d="m12 7 5.5 14"/><path d="M9.5 13h5"/></svg></i><span id="nav-title">我的导航页</span></div>

    </div>
  </div>
  <div id="groups-wrap" class="groups-wrap"></div>
</div>

}

function setTheme(t){
  currentTheme=t;
  try{localStorage.setItem('nav_page_theme',t);}catch(e){}
  const th=THEMES[t]||THEMES.dark;
  function hexToRgb(h){
    const m=h.match(/^#([a-fd]{2})([a-fd]{2})([a-fd]{2})$/i);
    if(!m)return null;
    return [parseInt(m[1],16),parseInt(m[2],16),parseInt(m[3],16)];
  }
  function lum(rgb){
    const a=rgb.map(v=>{v/=255;return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4)});
    return a[0]*0.2126+a[1]*0.7152+a[2]*0.0722;
  }
  function mix(a,b,alpha){return Math.round(a*alpha+b*(1-alpha));}
  const bgRgb=hexToRgb(th.bg);
  const alpha=cardOpacity;

  const final=bgRgb?[mix(255,bgRgb[0],alpha),mix(255,bgRgb[1],alpha),mix(255,bgRgb[2],alpha)]:[255,255,255];
  const L=lum(final);
  // 根据卡片背景亮度决定黑字还是白字

  const text=isLight?'#1a1a1a':'#ffffff';
  const textBase=isLight?'26,26,26':'255,255,255';

  const a2=Math.max(0.78, 0.96 - alpha * 0.55);
  const a3=Math.max(0.58, 0.88 - alpha * 0.5);
  const text2='rgba('+textBase+','+a2.toFixed(2)+')';
  const text3='rgba('+textBase+','+a3.toFixed(2)+')';
  const shadow=isLight?'0 1px 1px rgba(0,0,0,0.05)':'0 1px 2px rgba(0,0,0,0.35)';
  const vars={

    '--border':th.border,'--text':th.text,'--text2':th.text2,'--text3':th.text3,
    '--ac1':th.ac1,'--ac2':th.ac2,'--ac3':th.ac3,'--ac4':th.ac4,
    '--grad':th.grad,'--glow':th.glow,'--tag-bg':th.tag,'--tag':th.tagText,'--blur':th.blur,
    '--card-text':text,'--card-text2':text2,'--card-text3':text3,'--card-shadow':shadow,
  };
  const root=document.documentElement;
  Object.entries(vars).forEach(([k,v])=>root.style.setProperty(k,v));
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('active',b.dataset.t===t));
}

function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function escA(s){if(!s)return'';return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function iconHtml(icon){
  if(!icon)return '<i class="ic">'+svgInner('link')+'</i>';
  const k=resolveKey(icon);
  if(ICONS[k]||BRANDS[k])return '<i class="ic">'+svgInner(icon)+'</i>';
  return '<img src="'+escA(icon)+'" style="width:22px;height:22px;object-fit:contain;border-radius:4px" onerror="this.style.display=&quot;none&quot;">';
}

function filterLinks(kw){
  const k=kw.trim().toLowerCase();
  document.querySelectorAll('.group-section').forEach(sec=>{
    const links=sec.querySelectorAll('.link-card');
    let visible=0;
    links.forEach(card=>{
      const name=card.dataset.name||'';
      const note=card.dataset.note||'';
      const url=card.dataset.url||'';
      const show=!k||name.includes(k)||note.includes(k)||url.includes(k);
      card.style.display=show?'':'none';
      if(show)visible++;
    });
    sec.style.display=(visible===0&&k)?'none':'';
  });
  const any=[...document.querySelectorAll('.group-section')].some(s=>s.style.display!=='none');
  let noResult=document.getElementById('no-result');
  if(!any&&k){
    if(!noResult){noResult=document.createElement('div');noResult.id='no-result';noResult.className='no-result';document.getElementById('groups-wrap').appendChild(noResult);}
    noResult.innerHTML='<i class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></i>未找到匹配的链接';
    noResult.style.display='block';
  } else if(noResult){noResult.style.display='none';}
}

function render(){
  const wrap=document.getElementById('groups-wrap');
  wrap.innerHTML='';
  const groups=(DATA && Array.isArray(DATA.groups)) ? DATA.groups : [];
  if(!DATA){
    wrap.innerHTML='<div class="empty-page"><i class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg></i><p>数据文件缺失</p><p style="font-size:12px;margin-top:8px">请确保 navigation-data.js 与本页面位于同一目录</p></div>';
    return;
  }
  if(groups.length===0){
    wrap.innerHTML='<div class="empty-page"><i class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 22 7 12 12 2 7l10-5z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg></i><p>暂无分组或链接</p></div>';
    return;
  }
  groups.forEach(g=>{
    const links=g.links||[];
    const colorBg=g.color?g.color+'22':'var(--tag-bg)';
    const colorFg=g.color||'var(--ac1)';
    const sec=document.createElement('div');
    sec.className='group-section';
    let secHtml='<div class="group-header">'
      +'<div class="group-hicon" style="background:'+escA(colorBg)+';color:'+escA(colorFg)+'">'+iconHtml(g.icon)+'</div>'
      +'<span class="group-hname">'+esc(g.name)+'</span>'
      +'<span class="group-hcount">'+links.length+' 个链接</span>'
      +'</div>';
    if(links.length===0){
      secHtml+='<div class="links-grid empty-group"><div class="empty-group-tip">该分组暂无链接</div></div>';
    }else{
      secHtml+='<div class="links-grid">'
        +links.map(l=>{
          return '<a class="link-card" href="'+escA(l.url)+'" target="_blank" rel="noopener noreferrer" data-link-id="'+escA(l.id)+'" data-name="'+escA(l.name.toLowerCase())+'" data-note="'+escA((l.note||"").toLowerCase())+'" data-url="'+escA(l.url.toLowerCase())+'">'
            +'<div class="card-top">'
            +'<div class="card-icon" style="background:'+escA(colorBg)+';color:'+escA(colorFg)+'">'+iconHtml(l.icon)+'</div>'
            +'<div class="card-info"><div class="card-name">'+esc(l.name)+'</div><div class="card-url">'+esc(l.url)+'</div></div>'
            +'</div>'
            +(l.note?'<div class="card-note">'+esc(l.note)+'</div>':'')
            +'</a>';
        }).join('')
        +'</div>';
    }
    sec.innerHTML=secHtml;
    wrap.appendChild(sec);
  });
}

// 暴露给按钮
window.setTheme=setTheme;
window.filterLinks=filterLinks;

render();

// 运行时应用设置（标题 / favicon / 主题 / 壁纸模式）
function applySettings(){
  if(SETTINGS.title){document.title=SETTINGS.title;const t=document.getElementById('nav-title');if(t)t.textContent=SETTINGS.title;}
  if(SETTINGS.favicon){const l=document.createElement('link');l.rel='icon';l.href=SETTINGS.favicon;document.head.appendChild(l);}
  const themeBtns=document.getElementById('theme-btns');
  if(SETTINGS.useWallpaper && SETTINGS.bgDesktop){
    // 壁纸模式：隐藏主题切换按钮
    if(themeBtns)themeBtns.style.display='none';
    document.documentElement.style.setProperty('--wp-d','url("'+SETTINGS.bgDesktop+'")');
    document.documentElement.style.setProperty('--wp-m','url("'+(SETTINGS.bgMobile||SETTINGS.bgDesktop)+'")');
    document.body.classList.add('wp-mode');
    try{localStorage.removeItem('nav_page_theme');}catch(e){}
  }else{
    if(themeBtns)themeBtns.style.display='';
    setTheme(currentTheme);
  }
}
applySettings();
})();
</script>
